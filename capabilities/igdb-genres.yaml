naftiko: 1.0.0-alpha2
info:
  label: Twitch IGDB API — Genres
  description: 'Twitch IGDB API — Genres. 1 operations. Lead operation: Twitch Query Genres. Self-contained Naftiko capability
    covering one Twitch business surface.'
  tags:
  - Twitch
  - Genres
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TWITCH_API_KEY: TWITCH_API_KEY
capability:
  consumes:
  - type: http
    namespace: igdb-genres
    baseUri: https://api.igdb.com/v4
    description: Twitch IGDB API — Genres business capability. Self-contained, no shared references.
    resources:
    - name: genres
      path: /genres
      operations:
      - name: querygenres
        method: POST
        description: Twitch Query Genres
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.TWITCH_API_KEY}}'
  exposes:
  - type: rest
    namespace: igdb-genres-rest
    port: 8080
    description: REST adapter for Twitch IGDB API — Genres. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/genres
      name: genres
      description: REST surface for genres.
      operations:
      - method: POST
        name: querygenres
        description: Twitch Query Genres
        call: igdb-genres.querygenres
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: igdb-genres-mcp
    port: 9090
    transport: http
    description: MCP adapter for Twitch IGDB API — Genres. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: twitch-query-genres
      description: Twitch Query Genres
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: igdb-genres.querygenres
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
