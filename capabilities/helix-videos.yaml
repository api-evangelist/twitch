naftiko: 1.0.0-alpha2
info:
  label: Twitch Helix API — Videos
  description: 'Twitch Helix API — Videos. 2 operations. Lead operation: Twitch Get Videos. Self-contained Naftiko capability
    covering one Twitch business surface.'
  tags:
  - Twitch
  - Videos
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TWITCH_API_KEY: TWITCH_API_KEY
capability:
  consumes:
  - type: http
    namespace: helix-videos
    baseUri: https://api.twitch.tv/helix
    description: Twitch Helix API — Videos business capability. Self-contained, no shared references.
    resources:
    - name: videos
      path: /videos
      operations:
      - name: getvideos
        method: GET
        description: Twitch Get Videos
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: query
          type: string
        - name: user_id
          in: query
          type: string
        - name: game_id
          in: query
          type: string
        - name: language
          in: query
          type: string
        - name: period
          in: query
          type: string
        - name: sort
          in: query
          type: string
        - name: type
          in: query
          type: string
      - name: deletevideos
        method: DELETE
        description: Twitch Delete Videos
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: query
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.TWITCH_API_KEY}}'
  exposes:
  - type: rest
    namespace: helix-videos-rest
    port: 8080
    description: REST adapter for Twitch Helix API — Videos. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/videos
      name: videos
      description: REST surface for videos.
      operations:
      - method: GET
        name: getvideos
        description: Twitch Get Videos
        call: helix-videos.getvideos
        with:
          id: rest.id
          user_id: rest.user_id
          game_id: rest.game_id
          language: rest.language
          period: rest.period
          sort: rest.sort
          type: rest.type
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletevideos
        description: Twitch Delete Videos
        call: helix-videos.deletevideos
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: helix-videos-mcp
    port: 9090
    transport: http
    description: MCP adapter for Twitch Helix API — Videos. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: twitch-get-videos
      description: Twitch Get Videos
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: helix-videos.getvideos
      with:
        id: tools.id
        user_id: tools.user_id
        game_id: tools.game_id
        language: tools.language
        period: tools.period
        sort: tools.sort
        type: tools.type
      outputParameters:
      - type: object
        mapping: $.
    - name: twitch-delete-videos
      description: Twitch Delete Videos
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: helix-videos.deletevideos
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
