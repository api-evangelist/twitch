    baseUri: https://api.twitch.tv/helix
    description: Twitch Helix API — Chat business capability. Self-contained, no shared references.
    resources:
    - name: chat-announcements
      path: /chat/announcements
      operations:
      - name: sendchatannouncement
        method: POST
        description: Twitch Send Chat Announcement
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: broadcaster_id
          in: query
          type: string
          required: true
        - name: moderator_id
          in: query
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: chat-badges
      path: /chat/badges
      operations:
      - name: getchannelchatbadges
        method: GET
        description: Twitch Get Channel Chat Badges
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
