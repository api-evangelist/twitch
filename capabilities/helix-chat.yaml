        method: GET
        description: Twitch Get Chatters
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: broadcaster_id
          in: query
          type: string
          required: true
        - name: moderator_id
          in: query
          type: string
          required: true
    - name: chat-emotes
      path: /chat/emotes
      operations:
      - name: getchannelemotes
        method: GET
        description: Twitch Get Channel Emotes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: broadcaster_id
          in: query
          type: string
          required: true
    - name: chat-emotes-global
