        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: emote_set_id
          in: query
          type: string
          required: true
    - name: chat-messages
      path: /chat/messages
      operations:
      - name: sendchatmessage
        method: POST
        description: Twitch Send Chat Message
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: chat-settings
      path: /chat/settings
      operations:
      - name: getchatsettings
        method: GET
        description: Twitch Get Chat Settings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
