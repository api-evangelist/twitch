naftiko: 1.0.0-alpha2
info:
  label: Twitch Drops API — Analytics
  description: 'Twitch Drops API — Analytics. 1 operations. Lead operation: Twitch Get Game Analytics. Self-contained Naftiko
    capability covering one Twitch business surface.'
  tags:
  - Twitch
  - Analytics
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TWITCH_API_KEY: TWITCH_API_KEY
capability:
  consumes:
  - type: http
    namespace: drops-analytics
    baseUri: https://api.twitch.tv/helix
    description: Twitch Drops API — Analytics business capability. Self-contained, no shared references.
    resources:
    - name: analytics-games
      path: /analytics/games
      operations:
      - name: getgameanalytics
        method: GET
        description: Twitch Get Game Analytics
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: game_id
          in: query
          type: string
        - name: type
          in: query
          type: string
        - name: started_at
          in: query
          type: string
        - name: ended_at
          in: query
          type: string
        - name: first
          in: query
          type: integer
        - name: after
          in: query
          type: string
    authentication:
      type: bearer
      token: '{{env.TWITCH_API_KEY}}'
  exposes:
  - type: rest
    namespace: drops-analytics-rest
    port: 8080
    description: REST adapter for Twitch Drops API — Analytics. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/analytics/games
      name: analytics-games
      description: REST surface for analytics-games.
      operations:
      - method: GET
        name: getgameanalytics
        description: Twitch Get Game Analytics
        call: drops-analytics.getgameanalytics
        with:
          game_id: rest.game_id
          type: rest.type
          started_at: rest.started_at
          ended_at: rest.ended_at
          first: rest.first
          after: rest.after
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: drops-analytics-mcp
    port: 9090
    transport: http
    description: MCP adapter for Twitch Drops API — Analytics. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: twitch-get-game-analytics
      description: Twitch Get Game Analytics
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: drops-analytics.getgameanalytics
      with:
        game_id: tools.game_id
        type: tools.type
        started_at: tools.started_at
        ended_at: tools.ended_at
        first: tools.first
        after: tools.after
      outputParameters:
      - type: object
        mapping: $.
