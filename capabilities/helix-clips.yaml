naftiko: 1.0.0-alpha2
info:
  label: Twitch Helix API — Clips
  description: 'Twitch Helix API — Clips. 2 operations. Lead operation: Twitch Get Clips. Self-contained Naftiko capability
    covering one Twitch business surface.'
  tags:
  - Twitch
  - Clips
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TWITCH_API_KEY: TWITCH_API_KEY
capability:
  consumes:
  - type: http
    namespace: helix-clips
    baseUri: https://api.twitch.tv/helix
    description: Twitch Helix API — Clips business capability. Self-contained, no shared references.
    resources:
    - name: clips
      path: /clips
      operations:
      - name: getclips
        method: GET
        description: Twitch Get Clips
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: broadcaster_id
          in: query
          type: string
        - name: game_id
          in: query
          type: string
        - name: id
          in: query
          type: string
        - name: started_at
          in: query
          type: string
        - name: ended_at
          in: query
          type: string
      - name: createclip
        method: POST
        description: Twitch Create Clip
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: broadcaster_id
          in: query
          type: string
          required: true
        - name: has_delay
          in: query
          type: boolean
    authentication:
      type: bearer
      token: '{{env.TWITCH_API_KEY}}'
  exposes:
  - type: rest
    namespace: helix-clips-rest
    port: 8080
    description: REST adapter for Twitch Helix API — Clips. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/clips
      name: clips
      description: REST surface for clips.
      operations:
      - method: GET
        name: getclips
        description: Twitch Get Clips
        call: helix-clips.getclips
        with:
          broadcaster_id: rest.broadcaster_id
          game_id: rest.game_id
          id: rest.id
          started_at: rest.started_at
          ended_at: rest.ended_at
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createclip
        description: Twitch Create Clip
        call: helix-clips.createclip
        with:
          broadcaster_id: rest.broadcaster_id
          has_delay: rest.has_delay
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: helix-clips-mcp
    port: 9090
    transport: http
    description: MCP adapter for Twitch Helix API — Clips. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: twitch-get-clips
      description: Twitch Get Clips
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: helix-clips.getclips
      with:
        broadcaster_id: tools.broadcaster_id
        game_id: tools.game_id
        id: tools.id
        started_at: tools.started_at
        ended_at: tools.ended_at
      outputParameters:
      - type: object
        mapping: $.
    - name: twitch-create-clip
      description: Twitch Create Clip
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: helix-clips.createclip
      with:
        broadcaster_id: tools.broadcaster_id
        has_delay: tools.has_delay
      outputParameters:
      - type: object
        mapping: $.
