naftiko: 1.0.0-alpha2
info:
  label: Twitch Helix API — Subscriptions
  description: 'Twitch Helix API — Subscriptions. 1 operations. Lead operation: Twitch Get Broadcaster Subscriptions. Self-contained
    Naftiko capability covering one Twitch business surface.'
  tags:
  - Twitch
  - Subscriptions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TWITCH_API_KEY: TWITCH_API_KEY
capability:
  consumes:
  - type: http
    namespace: helix-subscriptions
    baseUri: https://api.twitch.tv/helix
    description: Twitch Helix API — Subscriptions business capability. Self-contained, no shared references.
    resources:
    - name: subscriptions
      path: /subscriptions
      operations:
      - name: getbroadcastersubscriptions
        method: GET
        description: Twitch Get Broadcaster Subscriptions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: broadcaster_id
          in: query
          type: string
          required: true
        - name: user_id
          in: query
          type: string
    authentication:
      type: bearer
      token: '{{env.TWITCH_API_KEY}}'
  exposes:
  - type: rest
    namespace: helix-subscriptions-rest
    port: 8080
    description: REST adapter for Twitch Helix API — Subscriptions. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/subscriptions
      name: subscriptions
      description: REST surface for subscriptions.
      operations:
      - method: GET
        name: getbroadcastersubscriptions
        description: Twitch Get Broadcaster Subscriptions
        call: helix-subscriptions.getbroadcastersubscriptions
        with:
          broadcaster_id: rest.broadcaster_id
          user_id: rest.user_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: helix-subscriptions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Twitch Helix API — Subscriptions. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: twitch-get-broadcaster-subscriptions
      description: Twitch Get Broadcaster Subscriptions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: helix-subscriptions.getbroadcastersubscriptions
      with:
        broadcaster_id: tools.broadcaster_id
        user_id: tools.user_id
      outputParameters:
      - type: object
        mapping: $.
