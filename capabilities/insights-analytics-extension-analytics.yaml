naftiko: 1.0.0-alpha2
info:
  label: Twitch Insights and Analytics API — Extension Analytics
  description: 'Twitch Insights and Analytics API — Extension Analytics. 1 operations. Lead operation: Twitch Get Extension
    Analytics. Self-contained Naftiko capability covering one Twitch business surface.'
  tags:
  - Twitch
  - Extension Analytics
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TWITCH_API_KEY: TWITCH_API_KEY
capability:
  consumes:
  - type: http
    namespace: insights-analytics-extension-analytics
    baseUri: https://api.twitch.tv/helix
    description: Twitch Insights and Analytics API — Extension Analytics business capability. Self-contained, no shared references.
    resources:
    - name: analytics-extensions
      path: /analytics/extensions
      operations:
      - name: getextensionanalytics
        method: GET
        description: Twitch Get Extension Analytics
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: extension_id
          in: query
          type: string
          description: Extension ID to filter by
        - name: type
          in: query
          type: string
          description: The type of analytics report
        - name: started_at
          in: query
          type: string
          description: Start of the date range (RFC 3339)
        - name: ended_at
          in: query
          type: string
          description: End of the date range (RFC 3339)
        - name: first
          in: query
          type: integer
          description: Maximum number of results to return
        - name: after
          in: query
          type: string
          description: Cursor for forward pagination
    authentication:
      type: bearer
      token: '{{env.TWITCH_API_KEY}}'
  exposes:
  - type: rest
    namespace: insights-analytics-extension-analytics-rest
    port: 8080
    description: REST adapter for Twitch Insights and Analytics API — Extension Analytics. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/analytics/extensions
      name: analytics-extensions
      description: REST surface for analytics-extensions.
      operations:
      - method: GET
        name: getextensionanalytics
        description: Twitch Get Extension Analytics
        call: insights-analytics-extension-analytics.getextensionanalytics
        with:
          extension_id: rest.extension_id
          type: rest.type
          started_at: rest.started_at
          ended_at: rest.ended_at
          first: rest.first
          after: rest.after
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: insights-analytics-extension-analytics-mcp
    port: 9090
    transport: http
    description: MCP adapter for Twitch Insights and Analytics API — Extension Analytics. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: twitch-get-extension-analytics
      description: Twitch Get Extension Analytics
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: insights-analytics-extension-analytics.getextensionanalytics
      with:
        extension_id: tools.extension_id
        type: tools.type
        started_at: tools.started_at
        ended_at: tools.ended_at
        first: tools.first
        after: tools.after
      outputParameters:
      - type: object
        mapping: $.
