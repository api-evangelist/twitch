naftiko: 1.0.0-alpha2
info:
  label: Twitch Helix API — Moderation
  description: 'Twitch Helix API — Moderation. 7 operations. Lead operation: Twitch Manage Held AutoMod Messages. Self-contained
    Naftiko capability covering one Twitch business surface.'
  tags:
  - Twitch
  - Moderation
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TWITCH_API_KEY: TWITCH_API_KEY
capability:
  consumes:
  - type: http
    namespace: helix-moderation
    baseUri: https://api.twitch.tv/helix
    description: Twitch Helix API — Moderation business capability. Self-contained, no shared references.
    resources:
    - name: moderation-automod-message
      path: /moderation/automod/message
      operations:
      - name: manageautomodheldmessage
        method: POST
        description: Twitch Manage Held AutoMod Messages
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: moderation-banned
      path: /moderation/banned
      operations:
      - name: getbannedusers
        method: GET
        description: Twitch Get Banned Users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: broadcaster_id
          in: query
          type: string
          required: true
        - name: user_id
          in: query
          type: string
    - name: moderation-bans
      path: /moderation/bans
      operations:
      - name: banuser
        method: POST
        description: Twitch Ban User
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: broadcaster_id
          in: query
          type: string
          required: true
        - name: moderator_id
          in: query
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: unbanuser
        method: DELETE
        description: Twitch Unban User
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: broadcaster_id
          in: query
          type: string
          required: true
        - name: moderator_id
          in: query
          type: string
          required: true
        - name: user_id
          in: query
          type: string
          required: true
    - name: moderation-moderators
      path: /moderation/moderators
      operations:
      - name: getmoderators
        method: GET
        description: Twitch Get Moderators
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: broadcaster_id
          in: query
          type: string
          required: true
        - name: user_id
          in: query
          type: string
      - name: addchannelmoderator
        method: POST
        description: Twitch Add Channel Moderator
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: broadcaster_id
          in: query
          type: string
          required: true
        - name: user_id
          in: query
          type: string
          required: true
      - name: removechannelmoderator
        method: DELETE
        description: Twitch Remove Channel Moderator
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: broadcaster_id
          in: query
          type: string
          required: true
        - name: user_id
          in: query
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.TWITCH_API_KEY}}'
  exposes:
  - type: rest
    namespace: helix-moderation-rest
    port: 8080
    description: REST adapter for Twitch Helix API — Moderation. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/moderation/automod/message
      name: moderation-automod-message
      description: REST surface for moderation-automod-message.
      operations:
      - method: POST
        name: manageautomodheldmessage
        description: Twitch Manage Held AutoMod Messages
        call: helix-moderation.manageautomodheldmessage
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/moderation/banned
      name: moderation-banned
      description: REST surface for moderation-banned.
      operations:
      - method: GET
        name: getbannedusers
        description: Twitch Get Banned Users
        call: helix-moderation.getbannedusers
        with:
          broadcaster_id: rest.broadcaster_id
          user_id: rest.user_id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/moderation/bans
      name: moderation-bans
      description: REST surface for moderation-bans.
      operations:
      - method: POST
        name: banuser
        description: Twitch Ban User
        call: helix-moderation.banuser
        with:
          broadcaster_id: rest.broadcaster_id
          moderator_id: rest.moderator_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: unbanuser
        description: Twitch Unban User
        call: helix-moderation.unbanuser
        with:
          broadcaster_id: rest.broadcaster_id
          moderator_id: rest.moderator_id
          user_id: rest.user_id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/moderation/moderators
      name: moderation-moderators
      description: REST surface for moderation-moderators.
      operations:
      - method: GET
        name: getmoderators
        description: Twitch Get Moderators
        call: helix-moderation.getmoderators
        with:
          broadcaster_id: rest.broadcaster_id
          user_id: rest.user_id
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: addchannelmoderator
        description: Twitch Add Channel Moderator
        call: helix-moderation.addchannelmoderator
        with:
          broadcaster_id: rest.broadcaster_id
          user_id: rest.user_id
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: removechannelmoderator
        description: Twitch Remove Channel Moderator
        call: helix-moderation.removechannelmoderator
        with:
          broadcaster_id: rest.broadcaster_id
          user_id: rest.user_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: helix-moderation-mcp
    port: 9090
    transport: http
    description: MCP adapter for Twitch Helix API — Moderation. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: twitch-manage-held-automod-messages
      description: Twitch Manage Held AutoMod Messages
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: helix-moderation.manageautomodheldmessage
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: twitch-get-banned-users
      description: Twitch Get Banned Users
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: helix-moderation.getbannedusers
      with:
        broadcaster_id: tools.broadcaster_id
        user_id: tools.user_id
      outputParameters:
      - type: object
        mapping: $.
    - name: twitch-ban-user
      description: Twitch Ban User
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: helix-moderation.banuser
      with:
        broadcaster_id: tools.broadcaster_id
        moderator_id: tools.moderator_id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: twitch-unban-user
      description: Twitch Unban User
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: helix-moderation.unbanuser
      with:
        broadcaster_id: tools.broadcaster_id
        moderator_id: tools.moderator_id
        user_id: tools.user_id
      outputParameters:
      - type: object
        mapping: $.
    - name: twitch-get-moderators
      description: Twitch Get Moderators
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: helix-moderation.getmoderators
      with:
        broadcaster_id: tools.broadcaster_id
        user_id: tools.user_id
      outputParameters:
      - type: object
        mapping: $.
    - name: twitch-add-channel-moderator
      description: Twitch Add Channel Moderator
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: helix-moderation.addchannelmoderator
      with:
        broadcaster_id: tools.broadcaster_id
        user_id: tools.user_id
      outputParameters:
      - type: object
        mapping: $.
    - name: twitch-remove-channel-moderator
      description: Twitch Remove Channel Moderator
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: helix-moderation.removechannelmoderator
      with:
        broadcaster_id: tools.broadcaster_id
        user_id: tools.user_id
      outputParameters:
      - type: object
        mapping: $.
