naftiko: "1.0.0-alpha1"

info:
  label: "Twitch IGDB API"
  description: >-
    The Internet Game Database (IGDB) API provides comprehensive video game
    information including metadata, ratings, screenshots, videos, and media.
    IGDB is owned and operated by Twitch and uses Twitch OAuth for authentication.
  tags:
    - Twitch
    - IGDB
    - Gaming
    - Game Database
    - Metadata
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      TWITCH_ACCESS_TOKEN: TWITCH_ACCESS_TOKEN
      TWITCH_CLIENT_ID: TWITCH_CLIENT_ID

capability:
  consumes:
    - type: http
      namespace: twitch-igdb
      baseUri: https://api.igdb.com/v4
      description: "IGDB video game database API"
      authentication:
        type: bearer
        token: "{{TWITCH_ACCESS_TOKEN}}"
      resources:
        - name: games
          path: /games
          description: "Video game data including metadata, ratings, and media"
          operations:
            - name: query-games
              method: POST
              description: "Query games using Apicalypse query language"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: text
                data:
                  query: "{{tools.query}}"

        - name: platforms
          path: /platforms
          description: "Gaming platform data"
          operations:
            - name: query-platforms
              method: POST
              description: "Query gaming platforms"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: text
                data:
                  query: "{{tools.query}}"

        - name: genres
          path: /genres
          description: "Game genre data"
          operations:
            - name: query-genres
              method: POST
              description: "Query game genres"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: companies
          path: /companies
          description: "Game company data"
          operations:
            - name: query-companies
              method: POST
              description: "Query game companies (developers and publishers)"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: search
          path: /search
          description: "Multi-resource search across IGDB"
          operations:
            - name: multi-search
              method: POST
              description: "Search across multiple IGDB resource types"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8101
      namespace: twitch-igdb-api
      resources:
        - path: /v1/games
          name: games
          description: "Game database queries"
          operations:
            - method: POST
              name: query-games
              description: "Query game data"
              call: "twitch-igdb.query-games"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9101
      namespace: twitch-igdb-mcp
      transport: http
      tools:
        - name: query-games
          description: "Query the IGDB game database for video game information"
          hints:
            readOnly: true
            openWorld: true
          call: "twitch-igdb.query-games"
          outputParameters:
            - type: object
              mapping: "$."
        - name: query-platforms
          description: "Query gaming platform information from IGDB"
          hints:
            readOnly: true
            openWorld: true
          call: "twitch-igdb.query-platforms"
          outputParameters:
            - type: object
              mapping: "$."
        - name: query-companies
          description: "Query game developer and publisher information from IGDB"
          hints:
            readOnly: true
            openWorld: true
          call: "twitch-igdb.query-companies"
          outputParameters:
            - type: object
              mapping: "$."
        - name: multi-search
          description: "Search across all IGDB resource types"
          hints:
            readOnly: true
            openWorld: true
          call: "twitch-igdb.multi-search"
          outputParameters:
            - type: object
              mapping: "$."
