naftiko: 1.0.0-alpha2
info:
  label: Twitch IGDB API — Games
  description: 'Twitch IGDB API — Games. 3 operations. Lead operation: Twitch Query Games. Self-contained Naftiko capability
    covering one Twitch business surface.'
  tags:
  - Twitch
  - Games
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TWITCH_API_KEY: TWITCH_API_KEY
capability:
  consumes:
  - type: http
    namespace: igdb-games
    baseUri: https://api.igdb.com/v4
    description: Twitch IGDB API — Games business capability. Self-contained, no shared references.
    resources:
    - name: games
      path: /games
      operations:
      - name: querygames
        method: POST
        description: Twitch Query Games
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: games-count
      path: /games/count
      operations:
      - name: countgames
        method: POST
        description: Twitch Count Games
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: release_dates
      path: /release_dates
      operations:
      - name: queryreleasedates
        method: POST
        description: Twitch Query Release Dates
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.TWITCH_API_KEY}}'
  exposes:
  - type: rest
    namespace: igdb-games-rest
    port: 8080
    description: REST adapter for Twitch IGDB API — Games. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/games
      name: games
      description: REST surface for games.
      operations:
      - method: POST
        name: querygames
        description: Twitch Query Games
        call: igdb-games.querygames
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/games/count
      name: games-count
      description: REST surface for games-count.
      operations:
      - method: POST
        name: countgames
        description: Twitch Count Games
        call: igdb-games.countgames
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/release-dates
      name: release-dates
      description: REST surface for release_dates.
      operations:
      - method: POST
        name: queryreleasedates
        description: Twitch Query Release Dates
        call: igdb-games.queryreleasedates
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: igdb-games-mcp
    port: 9090
    transport: http
    description: MCP adapter for Twitch IGDB API — Games. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: twitch-query-games
      description: Twitch Query Games
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: igdb-games.querygames
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: twitch-count-games
      description: Twitch Count Games
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: igdb-games.countgames
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: twitch-query-release-dates
      description: Twitch Query Release Dates
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: igdb-games.queryreleasedates
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
