input CreatePollInput {
  broadcasterId: ID!
  title: String!
  choices: [PollChoiceInput!]!
  duration: Int!
  channelPointsVotingEnabled: Boolean
  channelPointsPerVote: Int
}

input PollChoiceInput {
  title: String!
}

input EndPollInput {
  broadcasterId: ID!
  id: ID!
  status: PollStatus!
}

input CreatePredictionInput {
  broadcasterId: ID!
  title: String!
  outcomes: [PredictionOutcomeInput!]!
  predictionWindow: Int!
}

input PredictionOutcomeInput {
  title: String!
}

input EndPredictionInput {
  broadcasterId: ID!
  id: ID!
  status: PredictionStatus!
  winningOutcomeId: ID
}

input BanUserInput {
  broadcasterId: ID!
  moderatorId: ID!
  userId: ID!
  reason: String
  duration: Int
}

input UnbanUserInput {
  broadcasterId: ID!
  moderatorId: ID!
  userId: ID!
}

input CreateCustomRewardInput {
  broadcasterId: ID!
  title: String!
  cost: Int!
  prompt: String
  isEnabled: Boolean
  backgroundColor: String
  isUserInputRequired: Boolean
  maxPerStreamEnabled: Boolean
  maxPerStream: Int
  maxPerUserPerStreamEnabled: Boolean
  maxPerUserPerStream: Int
  globalCooldownEnabled: Boolean
  globalCooldownSeconds: Int
  shouldRedemptionsSkipRequestQueue: Boolean
}

input UpdateCustomRewardInput {
  broadcasterId: ID!
  id: ID!
  title: String
  cost: Int
  prompt: String
  isEnabled: Boolean
  backgroundColor: String
  isUserInputRequired: Boolean
  maxPerStreamEnabled: Boolean
  maxPerStream: Int
  maxPerUserPerStreamEnabled: Boolean
  maxPerUserPerStream: Int
  globalCooldownEnabled: Boolean
  globalCooldownSeconds: Int
  isPaused: Boolean
  shouldRedemptionsSkipRequestQueue: Boolean
}

input SendChatAnnouncementInput {
  broadcasterId: ID!
  moderatorId: ID!
  message: String!
  color: String
}

input UpdateChatSettingsInput {
  broadcasterId: ID!
  moderatorId: ID!
  emoteMode: Boolean
  followerMode: Boolean
  followerModeDuration: Int
  slowMode: Boolean
  slowModeWaitTime: Int
  subscriberMode: Boolean
  uniqueChatMode: Boolean
  nonModeratorChatDelay: Boolean
  nonModeratorChatDelayDuration: Int
}

input StartRaidInput {
  fromBroadcasterId: ID!
  toBroadcasterId: ID!
}

input StartAdInput {
  broadcasterId: ID!
  length: Int!
}

input UpdateScheduleSegmentInput {
  broadcasterId: ID!
  id: ID!
  startTime: DateTime
  duration: Int
  categoryId: ID
  title: String
  isCanceled: Boolean
  timezone: String
}

# ─── Root Types ─────────────────────────────────────────────────────────────

type Query {
  """Fetch a live stream by user ID."""
  stream(userId: ID!): Stream

  """Fetch multiple live streams."""
  streams(
    userIds: [ID!]
    userLogins: [String!]
    gameIds: [ID!]
    type: StreamType
    language: String
    first: Int
    after: String
    before: String
  ): StreamConnection!

  """Fetch a channel by broadcaster ID."""
  channel(broadcasterId: ID!): Channel

  """Fetch a user by ID or login."""
  user(id: ID, login: String): User

  """Fetch multiple users by IDs or logins."""
  users(ids: [ID!], logins: [String!]): [User!]!

  """Fetch a game/category by ID or name."""
  game(id: ID, name: String): Game

  """Fetch multiple games/categories."""
  games(ids: [ID!], names: [String!]): [Game!]!

  """Fetch top games/categories by viewer count."""
  topGames(first: Int, after: String, before: String): [Game!]!

  """Fetch VODs for a user."""
  videos(
    userId: ID
    gameId: ID
    ids: [ID!]
    language: String
    period: String
    sort: VideoSort
    type: VideoType
    first: Int
    after: String
    before: String
  ): VideoConnection!

  """Fetch clips."""
  clips(
    broadcasterId: ID
    gameId: ID
    ids: [ID!]
    startedAt: DateTime
    endedAt: DateTime
    isFeatured: Boolean
    first: Int
    after: String
    before: String
  ): ClipConnection!

  """Fetch followers of a broadcaster."""
  followers(
    broadcasterId: ID!
    userId: ID
    first: Int
    after: String
  ): FollowerConnection!

  """Fetch subscriptions for a broadcaster."""
  subscriptions(
    broadcasterId: ID!
    userId: [ID!]
    first: Int
    after: String
  ): SubscriptionConnection!

  """Fetch the stream schedule for a broadcaster."""
  schedule(broadcasterId: ID!, startTime: DateTime, utcOffset: String, first: Int, after: String): Schedule

  """Fetch polls for a broadcaster."""
  polls(broadcasterId: ID!, id: [ID!], status: PollStatus, first: Int, after: String): [Poll!]!

  """Fetch predictions for a broadcaster."""
  predictions(broadcasterId: ID!, id: [ID!], status: PredictionStatus, first: Int, after: String): [Prediction!]!

  """Fetch the Bits leaderboard for a broadcaster."""
  bitsLeaderboard(count: Int, period: String, startedAt: DateTime, userId: ID): [BitsLeaderboard!]!

  """Fetch Bits products for an extension."""
  bitsProducts(shouldIncludeAll: Boolean): [BitsProduct!]!

  """Fetch a broadcaster's channel point rewards."""
  customRewards(broadcasterId: ID!, id: [ID!], onlyManageableRewards: Boolean): [Reward!]!

  """Fetch redemptions for a reward."""
  customRewardRedemptions(
    broadcasterId: ID!
    rewardId: ID!
    status: RedemptionStatus
    id: [ID!]
    sort: String
    first: Int
    after: String
  ): [Redemption!]!

  """Fetch Hype Train events for a broadcaster."""
  hypeTrain(broadcasterId: ID!, first: Int, after: String): [HypeTrain!]!

  """Fetch banned users for a broadcaster."""
  bannedUsers(broadcasterId: ID!, userId: [ID!], first: Int, after: String, before: String): [BanUser!]!

  """Fetch unban requests for a broadcaster."""
  unbanRequests(broadcasterId: ID!, moderatorId: ID!, status: String, userId: ID, first: Int, after: String): [UnbanRequest!]!

  """Fetch shield mode status for a broadcaster."""
  shieldMode(broadcasterId: ID!, moderatorId: ID!): Shield

  """Fetch chat settings for a broadcaster."""
  chatSettings(broadcasterId: ID!, moderatorId: ID): ChatSettings

  """Fetch global or channel emotes."""
  emotes(broadcasterId: ID): [Emote!]!

  """Fetch global or channel badges."""
  badges(broadcasterId: ID): [Badge!]!

  """Fetch cheermotes."""
  cheermotes(broadcasterId: ID): [Cheermote!]!

  """Fetch goals for a broadcaster."""
  goals(broadcasterId: ID!): [Goal!]!

  """Fetch tags for streams."""
  tags(broadcasterId: ID!): [Tag!]!

  """Fetch EventSub subscriptions."""
  eventSubSubscriptions(status: String, type: String, userId: ID, after: String): [EventSubSubscription!]!

  """Fetch conduit shards."""
  conduitShards(conduitId: ID!, status: String, after: String): [ConduitShard!]!

  """Fetch VIPs for a broadcaster."""
  vips(broadcasterId: ID!, userId: [ID!], first: Int, after: String): [VIP!]!

  """Fetch ad schedule for a broadcaster."""
  adSchedule(broadcasterId: ID!): Ad

  """Fetch AutoMod held messages."""
  autoModHeld(broadcasterId: ID!, first: Int, after: String): [AutoMod!]!

  """Fetch blocked terms for a broadcaster."""
  blockedTerms(broadcasterId: ID!, moderatorId: ID!, first: Int, after: String): [BlockedTerm!]!

  """Search channels by query."""
  searchChannels(query: String!, first: Int, after: String, liveOnly: Boolean): [Channel!]!

  """Search categories/games by query."""
  searchCategories(query: String!, first: Int, after: String): [Category!]!

  """Fetch extensions for the authenticated user."""
  userExtensions: [Extension!]!
}

type Mutation {
  """Create a poll in a channel."""
  createPoll(input: CreatePollInput!): Poll!

  """End an active poll."""
  endPoll(input: EndPollInput!): Poll!

  """Create a prediction in a channel."""
  createPrediction(input: CreatePredictionInput!): Prediction!

  """End or resolve a prediction."""
  endPrediction(input: EndPredictionInput!): Prediction!

  """Ban or timeout a user."""
  banUser(input: BanUserInput!): BanUser!

  """Unban a user."""
  unbanUser(input: UnbanUserInput!): Boolean!

  """Create a custom channel point reward."""
  createCustomReward(input: CreateCustomRewardInput!): Reward!

  """Update an existing custom reward."""
  updateCustomReward(input: UpdateCustomRewardInput!): Reward!

  """Send a chat announcement."""
  sendChatAnnouncement(input: SendChatAnnouncementInput!): Boolean!

  """Update chat settings for a channel."""
  updateChatSettings(input: UpdateChatSettingsInput!): ChatSettings!

  """Raid another broadcaster's channel."""
  startRaid(input: StartRaidInput!): Boolean!

  """Cancel an in-progress raid."""
  cancelRaid(broadcasterId: ID!): Boolean!

  """Start an ad break."""
  startAd(input: StartAdInput!): Ad!

  """Snooze the next ad break."""
  snoozeNextAd(broadcasterId: ID!): Ad!

  """Update a schedule segment."""
  updateScheduleSegment(input: UpdateScheduleSegmentInput!): ScheduleSegment!

  """Delete a schedule segment."""
  deleteScheduleSegment(broadcasterId: ID!, id: ID!): Boolean!

  """Activate or deactivate Shield Mode."""
  updateShieldMode(broadcasterId: ID!, moderatorId: ID!, isActive: Boolean!): Shield!

  """Add a blocked term."""
  addBlockedTerm(broadcasterId: ID!, moderatorId: ID!, text: String!): BlockedTerm!

  """Remove a blocked term."""
  removeBlockedTerm(broadcasterId: ID!, moderatorId: ID!, id: ID!): Boolean!

  """Add a VIP to a channel."""
  addVIP(broadcasterId: ID!, userId: ID!): Boolean!

  """Remove a VIP from a channel."""
  removeVIP(broadcasterId: ID!, userId: ID!): Boolean!

  """Resolve an unban request."""
  resolveUnbanRequest(broadcasterId: ID!, moderatorId: ID!, unbanRequestId: ID!, status: String!, resolutionText: String): UnbanRequest!

  """Manage an AutoMod held message."""
  manageAutoModMessage(userId: ID!, msgId: ID!, action: String!): Boolean!
}
