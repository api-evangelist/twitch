specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Twitch
providerId: twitch
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Streaming
  - Live Video
  - Developer API
  - Gaming
description: The Twitch Helix API and Extensions API are offered to developers free of charge under Twitch's
  developer terms; access is gated by registering an application in the Twitch Developer Console and obtaining
  OAuth client credentials. There is no paid API tier or usage-based price list — usage is governed by
  rate limits (token-bucket) rather than a billed plan.
sources:
  - https://dev.twitch.tv/docs/api/
  - https://dev.twitch.tv/docs/api/guide/
plans:
  - id: twitch-developer
    name: Developer (Free)
    type: freemium
    description: Free Twitch Helix and Extensions API access for registered developer applications. No
      published per-call price; consumers must obtain OAuth credentials and respect token-bucket rate
      limits.
    entries:
      - label: Twitch Helix API Access
        name: helix_api_access
        type: flat
        metric: request
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '0'
        userMultiplied: false
      - label: App Access Token Bucket
        name: app_token_bucket
        type: quota
        metric: points_per_minute
        limit: 800
        timeFrame: minute
        geo: global
        unit: 1
        price: included
        userMultiplied: false
      - label: User Access Token Bucket
        name: user_token_bucket
        type: quota
        metric: points_per_minute
        limit: 800
        timeFrame: minute
        geo: global
        unit: 1
        price: included
        userMultiplied: false
    elements:
      - name: Twitch Helix API
      - name: Extensions API
      - name: EventSub Webhooks
      - name: OAuth via Developer Console
      - name: Community Support
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
